packages:
  - apps/*
  - packages/*

strictPeerDependencies: false

allowBuilds:
  esbuild: true
  "@vscode/vsce-sign": false
  # Published generators are self-contained; skip nested package installations.
  postman-code-generators: false
  core-js: false
  keytar: false

patchedDependencies:
  curl-to-postmanv2@1.8.7: patches/curl-to-postmanv2@1.8.7.patch
