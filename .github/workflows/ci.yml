name: Workspace checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:boundaries
      - name: Check shared packages and extension host
        run: pnpm --filter '!@onapi/webviews' -r typecheck
      - name: Check Webview types
        run: pnpm --dir apps/webviews typecheck
      - run: pnpm typecheck:e2e
      - run: pnpm test:unit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:ui
      - run: pnpm test:editor
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: artifacts/*.vsix
