syntax = "proto3";
package onapi.test;
message Request { string name = 1; int64 value = 2; bytes payload = 3; }
message Reply { string message = 1; int32 count = 2; string authorization = 3; }
service Echo {
  rpc Unary(Request) returns (Reply);
  rpc Server(Request) returns (stream Reply);
  rpc Client(stream Request) returns (Reply);
  rpc Bidi(stream Request) returns (stream Reply);
  rpc Fail(Request) returns (Reply);
  rpc Wait(Request) returns (Reply);
}
